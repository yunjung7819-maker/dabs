<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>응급용품 위치 · 더현대광주 신축공사</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  :root{
    --bg:#FBF6F1; --ink:#201712; --ink-soft:#5B4C43; --line:#EADACC;
    --green:#1F8A56; --green-deep:#146640;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:720px; margin:0 auto; padding:0 16px 50px; }

  .badge{
    display:inline-block; margin-top:20px;
    padding:6px 14px; border-radius:99px;
    background:var(--green); color:#fff; font-size:13px; font-weight:700;
  }
  .title-row{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin:14px 0 20px; }
  h1{ font-size:21px; margin:0; }
  .hint{ font-size:12px; color:var(--ink-soft); margin:0; }

  .chart-block{ margin-bottom:20px; }
  .map-wrap{ position:relative; }
  .map-wrap img{
    width:100%; height:auto;
    border-radius:12px;
    border:1px solid var(--line);
    display:block;
  }
  .hotspot{
    position:absolute;
    left:35.7%; top:31.4%;
    width:39.7%; height:29.2%;
    background:transparent;
    border:none;
    cursor:pointer;
    padding:0;
  }
  .hotspot:active{ background: rgba(255,255,255,.15); border-radius:12px; }

  .modal-overlay{
    display:none;
    position:fixed; inset:0;
    background: rgba(20,12,8,.75);
    z-index:50;
    align-items:center; justify-content:center;
    padding:24px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-overlay .modal-box{
    max-width:420px; width:100%;
    max-height:90vh;
    overflow-y:auto;
  }
  .modal-overlay img.modal-photo{
    width:100%; height:auto;
    border-radius:8px;
    border:5px solid #000;
    display:block;
  }
  .modal-overlay .photo-block{ margin-bottom:16px; }
  .modal-overlay .modal-cap{
    color:#fff; text-align:center;
    font-size:13.5px; font-weight:700;
    margin-top:10px;
  }
  .modal-overlay .modal-close{
    display:block; margin:14px auto 0;
    background:#fff; color:var(--ink);
    border:none; border-radius:99px;
    padding:9px 20px;
    font-size:13px; font-weight:700;
    font-family:inherit;
  }

  a.back{
    display:inline-block; margin-top:10px;
    color:var(--green); font-weight:700; text-decoration:none; font-size:14px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="badge">응급용품 위치</div>
    <div class="title-row">
      <h1>AED 위치 안내도</h1>
      <p class="hint">빨간 핀을 클릭하시면 사진을 볼 수 있습니다</p>
    </div>

    <div class="chart-block">
      <div class="map-wrap">
        <img src="aed-map.png" alt="AED 위치 안내도">
        <button type="button" class="hotspot" onclick="document.getElementById('aedModal1').classList.add('open')" aria-label="출입게이트 내부 AED 사진 보기"></button>
        <button type="button" class="hotspot" style="left:79.4%; top:30.3%; width:20.6%; height:30.3%;" onclick="document.getElementById('aedModal2').classList.add('open')" aria-label="안전교육장 내부 AED 사진 보기"></button>
      </div>
    </div>

    <div class="modal-overlay" id="aedModal1" onclick="if(event.target===this) this.classList.remove('open')">
      <div class="modal-box">
        <div class="photo-block">
          <img class="modal-photo" src="aed-photo-1.jpg" alt="출입게이트 내부 AED">
          <div class="modal-cap">출입게이트 내부 1 · AED</div>
        </div>
        <div class="photo-block">
          <img class="modal-photo" src="aed-photo-1b.jpg" alt="출입게이트 내부 비상구급장비 보관함">
          <div class="modal-cap">출입게이트 내부 1 · 비상구급장비 보관함(들것)</div>
        </div>
        <button type="button" class="modal-close" onclick="document.getElementById('aedModal1').classList.remove('open')">닫기</button>
      </div>
    </div>

    <div class="modal-overlay" id="aedModal2" onclick="if(event.target===this) this.classList.remove('open')">
      <div class="modal-box">
        <img class="modal-photo" src="aed-photo-2.jpg" alt="안전교육장 내부 AED">
        <div class="modal-cap">안전교육장 내부 1 · AED 실물 사진</div>
        <button type="button" class="modal-close" onclick="document.getElementById('aedModal2').classList.remove('open')">닫기</button>
      </div>
    </div>

    <a class="back" href="index.html">← 메인으로</a>
  </div>
</body>
</html>
