<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

  :root{
    --bg:#FFF7F1; --ink:#201712; --ink-soft:#5B4C43; --line:#EADACC;
    --red:#C21F2A; --red-deep:#8F1620;
    --amber:#E8940F; --amber-deep:#B4700A;
    --wine:#7A1E3D; --wine-deep:#54142B;
    --orange:#D2601A; --orange-deep:#A34712;
    --blue:#2178C4; --blue-deep:#175A94;
    --navy:#2B3A55; --navy-deep:#1D2740;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:520px; margin:0 auto; padding:0 20px 50px; }

  .site-tag{
    display:flex; align-items:center; gap:8px;
    padding:18px 0 4px; font-size:13px; color:var(--ink-soft); font-weight:600;
  }
  .site-tag .dot{ width:7px; height:7px; border-radius:50%; background:var(--red); animation: pulse 1.6s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  @media (prefers-reduced-motion: reduce){ .site-tag .dot{ animation:none; } }

  .back-btn{
    display:inline-flex; align-items:center; gap:6px;
    margin-top:16px; padding:8px 14px; border-radius:99px;
    background:#F3ECE4; color:var(--ink); font-size:13px; font-weight:700; text-decoration:none;
  }

  h1.page-title{ font-size:22px; font-weight:800; margin:18px 0 4px; }
  .page-sub{ font-size:13.5px; color:var(--ink-soft); margin:0 0 22px; }

  .menu{ display:flex; flex-direction:column; gap:12px; }

  .tile{
    position:relative; display:block; border-radius:16px; padding:20px;
    text-decoration:none; color:#fff; border:none; width:100%; text-align:left;
    font-family:inherit; cursor:pointer;
  }
  .tile:active{ transform: scale(0.99); }
  .tile .row{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .tile .txt{ flex:1; }
  .tile .title{ font-size:16.5px; font-weight:800; }
  .tile .sub{ font-size:12px; margin-top:4px; opacity:.9; }
  .tile .arrow{ font-size:20px; opacity:.9; }

  .tile.red{ background: linear-gradient(135deg, var(--red), var(--red-deep)); }
  .tile.amber{ background: linear-gradient(135deg, var(--amber), var(--amber-deep)); }
  .tile.wine{ background: linear-gradient(135deg, var(--wine), var(--wine-deep)); }
  .tile.orange{ background: linear-gradient(135deg, var(--orange), var(--orange-deep)); }
  .tile.blue{ background: linear-gradient(135deg, var(--blue), var(--blue-deep)); }
  .tile.navy{ background: linear-gradient(135deg, var(--navy), var(--navy-deep)); }

  .choices{ max-height:0; overflow:hidden; transition: max-height .22s ease; }
  .tile.open .choices{ max-height:120px; margin-top:14px; }
  .choices .opt-row{ display:flex; gap:8px; }
  .choices a{
    flex:1; display:flex; align-items:center; justify-content:center;
    background: rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.35);
    border-radius:10px; padding:11px 8px; color:#fff; text-decoration:none;
    font-size:13px; font-weight:700; text-align:center;
  }
  .choices a:active{ background: rgba(255,255,255,.28); }

  footer{
    margin-top:36px; padding-top:16px; border-top:1px solid var(--line);
    font-size:12px; color:var(--ink-soft); text-align:center;
  }
</style>
</head>
